<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Caserne 10 — Multiscreen Controller</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0a; --text:#e0d8cc; --text-dim:#8a8278; --accent:#c9a94e; --accent-dim:#8a7535; --red:#8b3a3a; --serif:'Cormorant Garamond',Georgia,serif; --sans:'Source Sans 3','Helvetica Neue',sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:2vh 4vw; overflow-y:auto; }
  h1 { font-family:var(--serif); font-size:3vh; font-weight:300; margin-bottom:0.5vh; }
  h1 em { color:var(--accent); font-style:italic; }
  .subtitle { font-size:1.4vh; color:var(--text-dim); letter-spacing:0.15em; text-transform:uppercase; margin-bottom:2vh; }
  .launch-row { display:flex; gap:1vw; flex-wrap:wrap; justify-content:center; }
  .launch-btn { padding:1.5vh 2vw; background:#141210; border:1px solid var(--accent-dim); color:var(--accent); font-family:var(--sans); font-size:1.6vh; cursor:pointer; transition:all 0.3s; }
  .launch-btn:hover { background:#1a1815; border-color:var(--accent); }
  .launch-all { margin-top:1.5vh; padding:1.5vh 4vw; background:var(--accent-dim); border:none; color:var(--bg); font-family:var(--sans); font-size:1.8vh; font-weight:600; cursor:pointer; }
  .launch-all:hover { background:var(--accent); }
  .divider { width:60px; height:1px; background:var(--accent-dim); margin:2vh 0; }
  .stage-indicator { display:flex; gap:0.8vw; margin:1.5vh 0; font-size:1.3vh; flex-wrap:wrap; justify-content:center; }
  .stage-dot { padding:0.5vh 0.8vw; border:1px solid #2a2520; color:var(--text-dim); transition:all 0.3s; white-space:nowrap; }
  .stage-dot.active { border-color:var(--accent); color:var(--accent); background:#1a1815; }
  .controls { display:flex; gap:2vw; align-items:center; margin-top:1.5vh; }
  .ctrl-btn { padding:1.5vh 2.5vw; background:#141210; border:1px solid #2a2520; color:var(--text); font-family:var(--sans); font-size:2vh; cursor:pointer; }
  .ctrl-btn:hover { border-color:var(--accent); color:var(--accent); }
  #slide-num { font-family:var(--serif); font-size:3vh; color:var(--accent); min-width:100px; text-align:center; }
  .notes-box { margin-top:1.5vh; max-width:600px; width:100%; background:#0d0c0a; border:1px solid #1a1815; padding:2vh 2vw; }
  .notes-label { font-size:1.1vh; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent-dim); margin-bottom:0.8vh; }
  #notes-text { font-size:1.6vh; color:var(--text-dim); line-height:1.6; }
  .sound-badge { display:inline-block; padding:0.3vh 0.8vw; background:#1a1510; border:1px solid var(--accent-dim); color:var(--accent); font-size:1.2vh; margin-top:0.8vh; }
</style>
</head>
<body>

<h1>From a Street Name to a <em>Catastrophe</em></h1>
<p class="subtitle">Multiscreen Controller</p>

<div class="launch-row">
  <button class="launch-btn" onclick="window.open('left.html','left')">LEFT Screen</button>
  <button class="launch-btn" onclick="window.open('center.html','center')">CENTER Screen</button>
  <button class="launch-btn" onclick="window.open('right.html','right')">RIGHT Screen</button>
</div>
<button class="launch-all" onclick="window.open('left.html','left'); window.open('center.html','center'); window.open('right.html','right');">LAUNCH ALL THREE</button>

<div class="divider"></div>

<div id="stage-bar" class="stage-indicator"></div>

<div class="controls">
  <button class="ctrl-btn" onclick="retreat()">← PREV</button>
  <span id="slide-num">1 / 14</span>
  <button class="ctrl-btn" onclick="advance()">NEXT →</button>
</div>

<div class="notes-box">
  <p class="notes-label">Presenter Notes</p>
  <p id="notes-text"></p>
  <p id="sound-info"></p>
</div>

<script>
const TOTAL = 14;
let current = 0;
let stage = 0;
const channel = new BroadcastChannel('caserne10-sync');

const STAGED = {
  0: { max: 2, labels: ['Center only', '+ Left screen', '+ Right screen'] },
  3: { max: 3, labels: ['Center: paragraph 1', '+ Left: Chief / Right: helmet', '+ Center: p2 / Right: Great Fire 🔥', '+ Center: p3 / Left: map'] }
};

const notes = [
  "TITLE — Center first. → left (traffic). → right (fire). → Part One.",
  "Your Monday walk. The curiosity. Why does a back lane have a name?",
  "The toponymy discovery. Read the entry, translate live. The street is a fossil.",
  "STAGED SLIDE — First shows only paragraph 1 (Bertram). → reveals Chief photo (left) + helmet (right). → adds paragraph 2 (Great Fire) + animated fire image (right). → adds paragraph 3 (Caserne 10) + map (left).",
  "Maps show change over time. Densification, commercial growth, fire risk.",
  "Set the scene. The Motherhouse, the soldiers, the crèche. 170 infants.",
  "The dramatic turn. Alarm sequence. 18 stations. Let the numbers land.",
  "Sub-Chief Marin. Four children at a time. Rescue stopped. The station's history becomes human.",
  "The death toll. Read victim names slowly. Let the audience absorb.",
  "PAUSE. The arson reveal. Every newspaper said 'electrical short circuit.' The truth came later.",
  "The rebuild. Shorey & Ritchie. Video plays on center right. Houde's program on right screen.",
  "The station today. 150 years continuous service. Interior, plaque, institutional memory.",
  "Your closing. The fossil metaphor. Take your time. Let silence hold.",
  "Sources. Gesture, invite questions."
];

const slideNum = document.getElementById('slide-num');
const notesText = document.getElementById('notes-text');
const soundInfo = document.getElementById('sound-info');
const stageBar = document.getElementById('stage-bar');

function updateUI() {
  slideNum.textContent = (current + 1) + ' / ' + TOTAL;
  notesText.textContent = notes[current] || '';

  const staged = STAGED[current];
  if (staged) {
    stageBar.style.display = 'flex';
    stageBar.innerHTML = '';
    staged.labels.forEach((label, i) => {
      const dot = document.createElement('div');
      dot.className = 'stage-dot' + (i <= stage ? ' active' : '');
      dot.textContent = label;
      stageBar.appendChild(dot);
    });
  } else {
    stageBar.style.display = 'none';
  }

  const soundSlides = {};
  soundInfo.innerHTML = '';
}

function advance() {
  const staged = STAGED[current];
  if (staged && stage < staged.max) {
    stage++;
    channel.postMessage({ type: 'stage', slide: current, stage: stage });
    updateUI();
  } else {
    current = Math.min(current + 1, TOTAL - 1);
    stage = 0;
    channel.postMessage({ type: 'goto', index: current });
    updateUI();
  }
}

function retreat() {
  const staged = STAGED[current];
  if (staged && stage > 0) {
    stage--;
    channel.postMessage({ type: 'stage', slide: current, stage: stage });
    updateUI();
  } else {
    current = Math.max(current - 1, 0);
    const prev = STAGED[current];
    stage = prev ? prev.max : 0;
    channel.postMessage({ type: 'goto', index: current });
    updateUI();
  }
}

channel.onmessage = (e) => {
  if (e.data.type === 'goto') { current = e.data.index; stage = 0; updateUI(); }
  if (e.data.type === 'stage') { stage = e.data.stage; updateUI(); }
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); advance(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); retreat(); }
  else if (e.key === 'Home') { current = 0; stage = 0; channel.postMessage({ type: 'goto', index: 0 }); updateUI(); }
  else if (e.key === 'End') { current = TOTAL - 1; stage = 0; channel.postMessage({ type: 'goto', index: TOTAL - 1 }); updateUI(); }
});

updateUI();
</script>
</body>
</html>
